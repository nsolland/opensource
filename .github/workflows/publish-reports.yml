name: Publish REHT PDF reports

on:
  push:
    branches: [main]
    paths:
      - 'reports/**'
      - 'tools/build_reports.py'
      - '.github/workflows/publish-reports.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned renderer dependencies
        run: pip install 'markdown==3.7' 'weasyprint==62.3'
      - name: Build REHT-versioned PDFs
        env:
          REHT_REPORT_VERSION: REHT-v1.0
          REPORT_PUBLISHED_DATE: '2026-09-05'
        run: python tools/build_reports.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
